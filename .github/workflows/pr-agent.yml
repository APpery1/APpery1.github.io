name: PR Agent
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Review PR with PR Agent
        uses: The-PR-Agent/pr-agent@ae131128de04294f3384d5db4266b0292787ccb6
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI.API_BASE: https://api.routin.ai/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: openai/gpt-6.1-sol
          config.fallback_models: '["openai/gpt-6.1-sol"]'
          config.custom_model_max_tokens: '32000'
          config.response_language: zh-CN
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review"]'
