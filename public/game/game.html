<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <title>鹈鹕 · 手机竞速</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a22;color:#e4eae2;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
    button{font:inherit;color:inherit;border:1px solid #536b70;touch-action:none;cursor:pointer}
    button:focus-visible{outline:2px solid #f0d69d;outline-offset:3px}
    [hidden]{display:none!important}
    #mobile-app{position:relative;display:flex;flex-direction:column;isolation:isolate;width:100%;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 45%,#213740,#101a22 70%);touch-action:none}
    .mobile-hud{flex-shrink:0;position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px;min-height:82px}
    .speed-readout{display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums;line-height:1}
    #mobile-speed{font-size:46px;font-style:italic;font-weight:650;letter-spacing:-2px;color:#f1d292}
    .speed-meta{display:flex;flex-direction:column;gap:8px;font-size:9px;color:#9db2b7;letter-spacing:1px}
    #mobile-lanes{display:flex;gap:4px}
    #mobile-lanes i{width:10px;height:3px;border-radius:2px;background:#41555c}
    #mobile-lanes i.selected{background:#e9cc92}
    .hud-actions{display:flex;gap:7px;align-items:center}
    .site-back{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-width:42px;min-height:42px;border:1px solid #3c565f;border-radius:12px;background:#1b3039;color:#cbdcd9;text-decoration:none;touch-action:manipulation}
    .site-back:hover{background:#33554e;color:#f1d292}
    .site-back:focus-visible{outline:2px solid #f0d69d;outline-offset:3px}
    .quiet-button{height:42px;min-width:42px;padding:0 11px;border-radius:12px;background:#1b3039;color:#cbdcd9;border-color:#3c565f}
    .icon-button{font-size:20px;padding:0;width:42px}
    #mobile-weather-toggle{position:relative;min-width:81px;font-size:13px;overflow:hidden}
    #mobile-transition-track{position:absolute;left:0;bottom:0;height:2px;width:0;background:#a0d4c2;opacity:0;transition:opacity .2s}
    #mobile-stage{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
    #race-scene{width:100%;height:100%;max-height:100%;display:block;pointer-events:none;background:transparent!important}
    #mobile-stage{contain:layout paint}
    #race-scene #weather-control,#race-scene #speed-hud{display:none}
    /* 手机轻量档：保留光路、雨雪和车流轮廓，去掉最耗时的高斯模糊合成。 */
    #race-scene.mobile-lite [filter="url(#softGlow)"],#race-scene.mobile-lite [filter="url(#groundShadow)"],#race-scene.mobile-lite [filter="url(#reflectionBlur)"],#race-scene.mobile-lite [filter="url(#beamSoften)"],#race-scene.mobile-lite [filter="url(#glassSoften)"],#race-scene.mobile-lite [filter="url(#glow)"],#race-scene.mobile-lite [filter="url(#engineGlow)"],#race-scene.mobile-lite [filter="url(#sparkGlow)"],#race-scene.mobile-lite [filter="url(#blastGlow)"],#race-scene.mobile-lite [filter="url(#lightningGlow)"]{filter:none!important}
    #race-scene.mobile-lite #tire-sparks path{stroke-width:1.2}
    #race-scene.mobile-lite #rain-impact-splashes path{display:none}
    #race-scene.mobile-lite #rain-impact-splashes path:nth-child(-n+6){display:block}
    #mobile-weather-drawer{position:absolute;z-index:8;top:78px;right:16px;left:16px;max-width:390px;margin-left:auto;padding:15px;border:1px solid #587079;border-radius:18px;background:#10232cef;box-shadow:0 12px 40px #030d1670}
    .weather-drawer-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:13px;color:#c6d7d5}
    .weather-drawer-heading button{border:0;background:transparent;min-width:32px;min-height:32px;border-radius:8px;font-size:20px;color:#a5bcbf}
    .weather-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .weather-choice{min-height:48px;border-radius:11px;background:#243a43;border-color:#3e5963;font-size:13px}
    .weather-choice[aria-pressed="true"]{background:#496f67;color:#faf2da;border-color:#a9ccb9}
    #mobile-weather-detail{font-size:11px;line-height:1.6;color:#9db4bb;margin:13px 0 0;min-height:18px}
    .touch-deck{position:relative;z-index:5;flex-shrink:0;padding:6px 16px 10px}
    #mobile-state{min-height:20px;margin:0 0 9px;text-align:center;font-size:11px;letter-spacing:.4px;color:#92a9ae}
    .touch-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
    .steer,.pedals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;flex:1}
    .pedals{flex:1.18;align-items:end}
    .drive-button{position:relative;min-height:76px;padding:10px 4px;border-radius:18px;background:#243b45;border-color:#526f78;box-shadow:inset 0 1px #8da5aa26,0 4px #09141a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:translateY(0)}
    .drive-button .glyph{font-size:28px;line-height:1;color:#c2d8da}
    .drive-button .label{font-size:12px;color:#b7ccd0;letter-spacing:1px}
    .drive-button.pressed{transform:translateY(3px);box-shadow:inset 0 1px #a8d2c94d,0 1px #09141a;background:#3b5f66;border-color:#9cc9c4}
    .drive-button.at-edge{opacity:.5}
    #mobile-brake{background:#493a3c;border-color:#83625f}
    #mobile-brake .glyph,#mobile-brake .label{color:#d9bbb1}
    #mobile-brake.pressed{background:#78534f;border-color:#e0a894}
    #mobile-throttle{min-height:96px;background:#33554e;border-color:#73988a}
    #mobile-throttle .glyph,#mobile-throttle .label{color:#deead3}
    #mobile-throttle.pressed{background:#527d6b;border-color:#c5ddaa}
    .mobile-tip{text-align:center;color:#6e8991;font-size:10px;line-height:1.3;margin:11px 0 0;letter-spacing:.5px}
    #mobile-app.fast #mobile-speed{color:#ee8b73}
    @media(max-width:359px){.mobile-hud{padding-inline:12px}.hud-actions{gap:5px}.quiet-button{padding-inline:9px}.icon-button{padding:0;width:39px;min-width:39px}#mobile-fullscreen{display:none}.touch-deck{padding-inline:12px}.touch-row{gap:12px}#mobile-speed{font-size:43px}}
    @media(orientation:landscape){
      .mobile-hud{position:absolute;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);padding:8px 18px;min-height:62px;pointer-events:none}
      .speed-readout{padding:7px 12px;border-radius:13px;background:#10212dd9;pointer-events:auto}
      #mobile-speed{font-size:34px}.speed-meta{font-size:8px;gap:6px}.hud-actions{pointer-events:auto}
      #mobile-stage{position:absolute;inset:0}
      #mobile-weather-drawer{top:68px;left:auto;right:max(18px,env(safe-area-inset-right));width:min(370px,75vw);padding:12px}.weather-choice{min-height:42px}.weather-drawer-heading{margin-bottom:7px}
      .touch-deck{position:absolute;left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);padding:0 18px 12px;pointer-events:none}
      .steer{flex:none;width:144px;pointer-events:auto}.pedals{flex:none;width:166px;pointer-events:auto}.drive-button{min-height:60px;border-radius:16px;background:#243b45e8;padding:7px 4px;gap:3px}.drive-button .glyph{font-size:24px}.drive-button .label{font-size:10px}#mobile-throttle{min-height:76px}
      #mobile-state{position:absolute;left:180px;right:200px;bottom:15px;margin:0;font-size:10px;text-shadow:0 1px 4px #000}.mobile-tip{display:none}
    }
    @media(orientation:landscape) and (max-height:360px){.mobile-hud{padding-top:5px}.quiet-button{height:36px}#mobile-weather-drawer{top:54px;padding:9px}.weather-choice{min-height:38px}#mobile-weather-detail{margin-top:7px}.weather-drawer-heading{margin-bottom:2px}.touch-deck{padding-bottom:8px}.drive-button{min-height:53px}#mobile-throttle{min-height:65px}}

    /* APpery town UI: quiet paper controls over the fast night road. */
    :root {
      --town-paper: #fffdf3;
      --town-paper-soft: #f1f3e4;
      --town-ink: #294536;
      --town-muted: #4a6154;
      --town-line: #c5d1bd;
      --town-green: #4f7d58;
      --town-coral: #d18564;
      --town-shadow: 0 8px 24px #203d2b2b;
    }
    html, body { background: #dfe8d9; color: var(--town-ink); }
    #mobile-app {
      background: linear-gradient(180deg, #dce8dc 0%, #f6f4e8 100%);
    }
    .mobile-hud {
      min-height: 76px;
      padding: 12px 18px 9px;
      background: linear-gradient(180deg, #fffdf3f2, #fffdf3d9);
      border-bottom: 1px solid #bdcdb9;
      box-shadow: 0 5px 22px #29453618;
    }
    .speed-readout {
      padding: 8px 13px;
      border: 1px solid var(--town-line);
      border-radius: 11px;
      background: var(--town-paper);
      box-shadow: var(--town-shadow);
      color: var(--town-ink);
    }
    #mobile-speed { color: var(--town-ink); font-size: 42px; }
    .speed-meta { color: var(--town-muted); }
    #mobile-lanes i { background: #c8d4c2; }
    #mobile-lanes i.selected { background: var(--town-coral); }
    .game-brand {
      position: absolute;
      left: 50%;
      top: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      min-width: 142px;
      padding: 7px 12px;
      border: 1px solid var(--town-line);
      border-radius: 11px;
      background: #fffdf3ed;
      box-shadow: var(--town-shadow);
      color: var(--town-ink);
      pointer-events: none;
    }
    .game-brand-mark { width: 14px; height: 14px; transform: rotate(30deg); border-radius: 3px; background: var(--town-green); box-shadow: 4px 4px 0 #9dbb92; }
    .game-brand-copy { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
    .game-brand-copy strong { font-size: 13px; letter-spacing: -.3px; }
    .game-brand-copy small { color: var(--town-muted); font-size: 8px; letter-spacing: 1.5px; }
    .hud-actions { gap: 6px; }
    .site-back, .quiet-button {
      min-width: 40px;
      min-height: 40px;
      border: 1px solid var(--town-line);
      border-radius: 10px;
      background: var(--town-paper);
      box-shadow: 0 4px 12px #29453620;
      color: var(--town-ink);
    }
    .site-back:hover, .quiet-button:hover, .quiet-button[aria-expanded="true"] { background: #e5eddd; color: var(--town-green); }
    .site-back:focus-visible, .quiet-button:focus-visible, .drive-button:focus-visible { outline: 3px solid var(--town-coral); outline-offset: 3px; }
    #mobile-weather-toggle { min-width: 88px; }
    #mobile-transition-track { background: var(--town-coral); }
    #mobile-weather-drawer {
      top: 76px;
      padding: 16px;
      border: 1px solid var(--town-line);
      border-radius: 14px;
      background: #fffdf3f5;
      box-shadow: 0 16px 45px #29453632;
      color: var(--town-ink);
      backdrop-filter: blur(12px);
    }
    .weather-drawer-heading { color: var(--town-ink); }
    .weather-drawer-heading button { color: var(--town-muted); }
    .weather-choice { border-color: var(--town-line); background: var(--town-paper-soft); color: var(--town-muted); }
    .weather-choice:hover, .weather-choice[aria-pressed="true"] { border-color: var(--town-green); background: #dce9d9; color: var(--town-ink); }
    #mobile-weather-detail, #mobile-state, .mobile-tip { color: var(--town-muted); }
    .touch-deck {
      padding: 9px 18px 13px;
      background: #fffdf3e8;
      border-top: 1px solid var(--town-line);
      box-shadow: 0 -7px 24px #29453618;
    }
    .drive-button {
      min-height: 70px;
      border: 1px solid var(--town-line);
      border-radius: 14px;
      background: var(--town-paper);
      box-shadow: 0 4px 0 #aec3aa, 0 8px 15px #29453618;
      color: var(--town-ink);
    }
    .drive-button .glyph { color: var(--town-green); }
    .drive-button .label { color: var(--town-muted); letter-spacing: .8px; }
    .drive-button.pressed { background: #dce9d9; border-color: var(--town-green); box-shadow: 0 1px 0 #aec3aa, 0 4px 10px #29453616; }
    #mobile-brake { background: #fae9df; border-color: #dfb7a4; }
    #mobile-brake .glyph, #mobile-brake .label { color: #a85745; }
    #mobile-brake.pressed { background: #f3d5c8; border-color: var(--town-coral); }
    #mobile-throttle { background: #dce9d9; border-color: #a9c5a4; }
    #mobile-throttle .glyph, #mobile-throttle .label { color: var(--town-green); }
    #mobile-throttle.pressed { background: #c7dec5; border-color: var(--town-green); }
    #mobile-app.fast #mobile-speed { color: var(--town-coral); }
    @media(max-width:500px) {
      .game-brand { display: none; }
      .game-brand-copy small { display: none; }
      .game-brand-copy strong { font-size: 12px; }
      .mobile-hud { padding-inline: 11px; }
      .speed-readout { padding-inline: 10px; }
      #mobile-speed { font-size: 38px; }
      .touch-deck { padding-inline: 12px; }
    }
  </style>
</head>
<body>
<main id="mobile-app">
  <div class="game-brand" aria-label="APpery 鹈鹕竞速">
    <span class="game-brand-mark" aria-hidden="true"></span>
    <span class="game-brand-copy"><strong>APpery.</strong><small>鹈鹕竞速</small></span>
  </div>
  <header class="mobile-hud" aria-label="车速与比赛操作">
    <div class="speed-readout" aria-label="实时车速"><output id="mobile-speed">60</output><div class="speed-meta"><span>KM/H</span><div id="mobile-lanes" aria-label="第3车道"><i></i><i></i><i class="selected"></i><i></i></div></div></div>
    <div class="hud-actions">
      <a class="site-back" href="../#work" aria-label="返回个人网站" title="返回个人网站"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a>
      <button id="mobile-weather-toggle" class="quiet-button" type="button" aria-expanded="false" aria-controls="mobile-weather-drawer"><span id="mobile-weather-name">雷暴雨</span><span id="mobile-transition-track" role="progressbar" aria-label="天气过渡" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></span></button>
      <button id="mobile-restart" class="quiet-button icon-button" type="button" aria-label="重新开始" title="重新开始">↻</button>
      <button id="mobile-fullscreen" class="quiet-button icon-button" type="button" aria-label="进入全屏" title="全屏">⛶</button>
    </div>
  </header>
  <section id="mobile-stage" aria-label="四车道竞速画面">
<svg id="race-scene" class="mobile-lite" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="900" viewBox="0 0 1400 900" data-weather="thunder" role="application" tabindex="0" aria-labelledby="title description" style="display:block;width:100%;height:100%;background:#101a22;user-select:none;touch-action:none">
  <title id="title">鹈鹕 · 全天候城市高架竞速</title>
  <desc id="description">鹈鹕驾驶翡翠绿机车在城市的四车道高架桥上竞速。左上角可切换台风、暴雪、雨夜、晴天、雷暴雨和雾霾：雨水带来积水倒影与轮胎水花，台风有强风气流和飞散碎屑，暴雪覆盖屋顶、护栏和路面，雾霾遮挡远景。天气切换保留速度和赛况，并以太阳升落、风力渐变、雨雪交替和积雪渐覆形成平滑过场。四辆对手同时出发，车流上限六辆，同车道车辆前后错开并保留安全间距。雨夜自动开启远光灯，雾霾与暴雪使用低位暖色雾灯，对手也随天气开启照明。湿路显露城市窗灯倒影和发亮道钉，雪天屋檐有冰挂与贴地吹雪，台风有低空水雾，晴天护栏投下斜影。直接用浏览器打开：W 加速，S 减速，A 向远侧切道，D 向近侧切道，R 重新开始。松开 W/S 保持速度，范围 0 至 220 千米每小时。超过 80 千米每小时，鹈鹕俯身，雨更倾斜，对手逐渐落后。超过 160 千米每小时，尾焰拉长，气流拖尾增强，轮胎间歇泛出火花，速度数字变红。超过 200 千米每小时，前后轮轮毂与胎缘随着旋转持续甩出金色火花。对手会预判碰撞并紧急换道避让，车道受阻时调整速度拉开距离。各车道会间歇出现速度各异的对手，同道撞车会出现爆炸，随后自动恢复。沥青铺装配白色标线，银灰金属护栏与多色玻璃幕墙随天气改变色调和照明；雪天出现积雪与车辙，雨天显露水珠、积水和倒影。远近天际线随行驶速度缓慢后移，路灯与湿路反光同步向后掠过。</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#141e27"/><stop offset=".48" stop-color="#35434e"/><stop offset="1" stop-color="#697880"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="65%" cy="68%" r="70%">
      <stop stop-color="#99afb7" stop-opacity=".24"/><stop offset="1" stop-color="#364650" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x2="0" y2="1">
      <stop stop-color="#263138"/><stop offset=".4" stop-color="#1b252c"/><stop offset="1" stop-color="#131c22"/>
    </linearGradient>
    <linearGradient id="roadSheen" x2="0" y2="1">
      <stop stop-color="#90a6ae" stop-opacity=".07"/><stop offset=".45" stop-color="#738a95" stop-opacity=".025"/><stop offset="1" stop-color="#738a95" stop-opacity="0"/>

    function updateWeatherTransition(dt) {
      if (!weatherTransition) return;
      const transition = weatherTransition;
      transition.elapsed = Math.min(transition.duration, transition.elapsed + dt);
      const u = transition.elapsed / transition.duration;
      const t = u * u * (3 - 2 * u);
      weather = blendWeatherValues(transition.from, transition.to, t);
      lighting = blendWeatherValues(transition.fromLighting, transition.toLighting, t);
      weather.sunsetAmount = Math.min(1, weather.sunsetAmount + transition.sunset * Math.abs(transition.to.day - transition.from.day) * Math.sin(Math.PI * u));
      // Flakes arrive before a layer of snow has built up on the city and road.
      if (transition.to.snow > transition.from.snow) {
        const buildup = clamp((u - .18) / .82, 0, 1);
        weather.snow = transition.from.snow + (transition.to.snow - transition.from.snow) * buildup * buildup * (3 - 2 * buildup);
      }
      if (u >= 1) {
        weather = transition.to;
        lighting = transition.toLighting;
        weatherTransition = null;
        byId('weather-current').textContent = weatherPresets[weatherKey].label;
      }
      weatherVisualDirty = true;

    const numberPattern = /-?\d*\.?\d+(?:e[-+]?\d+)?/gi;
    const morphs = Array.from(root.querySelectorAll('[data-tucked-d]'), node => ({
      node,
      template: node.getAttribute('d'),
      rest: node.getAttribute('d').match(numberPattern).map(Number),
      tucked: node.getAttribute('data-tucked-d').match(numberPattern).map(Number)
    }));
    let speed = 60;
    let lean = 0;
    let distance = 0;
    let lane = 2;
    let targetLane = 2;
    let laneVelocity = 0;
    let bank = 0;
    let crash = null;
    let collisionCount = 0;
    let invulnerability = 0;
    let depthOrder = '';
    let spawnTimer = 0;
    let spawnCount = 0;
    let nextOpponentSlot = 4;
    let avoidanceCount = 0;
    let lastTime = performance.now();
    let lastPose = -1;
    let sparkTimer = .2;
    let sparkCursor = 0;
    let sparkBursts = 0;
    let sparkMode = 'off';
    let continuousSparkTimer = 0;
    let continuousSparkEmissions = 0;
    let simulationAccumulator = 0;
    let lastPaint = -Infinity;
    let paintInterval = 1000 / 60;
    let timingStart = lastTime + 3000;
    let timingFrames = 0;

    // Sweep relative longitudinal and lateral motion, including rapid lane changes.
    function sweptOverlap(x0, x1, y0, y1, halfWidth, halfLane) {
      let enter = 0;
      let exit = 1;
      for (const [start, end, radius] of [[x0, x1, halfWidth], [y0, y1, halfLane]]) {
        const delta = end - start;
        if (Math.abs(delta) < 1e-9) {
          if (Math.abs(start) > radius) return false;
        } else {
          const a = (-radius - start) / delta;
          const b = (radius - start) / delta;
          enter = Math.max(enter, Math.min(a, b));
          exit = Math.min(exit, Math.max(a, b));
          if (enter > exit) return false;
        }
      }
      return true;
    }

    function pickTrafficSpeed(profile) {
      const roll = Math.random();
      const kind = profile || (roll < .42 ? 'slow' : roll < .77 ? 'medium' : 'fast');
      const [min, max] = kind === 'slow' ? [42, 78] : kind === 'medium' ? [85, 122] : [135, 178];
      return Math.round(randomBetween(min, max));
    }

    function activateOpponent(opponent, assignedLane, x, velocity) {
      opponent.lane = opponent.previousLane = opponent.targetLane = opponent.laneStart = assignedLane;
      opponent.maneuverTime = EVADE_DURATION;
      opponent.laneVelocity = opponent.bank = opponent.avoidCooldown = opponent.evasions = 0;
      opponent.avoidance = 'cruising';
      opponent.braking = false;
      opponent.x = opponent.previousX = x;
      opponent.speed = opponent.cruiseSpeed = velocity;
      opponent.active = true;
      opponent.recycled = true;
      opponent.age = opponent.offscreenAge = 0;
      opponent.node.setAttribute('color', trafficColors[Math.floor(Math.random() * trafficColors.length)]);
      style(opponent.node, '--wheel-duration', `${(88 / velocity).toFixed(3)}s`);
      spawnCount++;
    }

    function retireOpponent(opponent) {
      opponent.active = false;
      opponent.recycled = true;
      opponent.avoidance = 'cruising';
      opponent.braking = false;
    }

    function resetTraffic() {
      spawnCount = avoidanceCount = 0;
      nextOpponentSlot = 4;
      spawnTimer = randomBetween(1.7, 3);
      opponents.forEach(opponent => { opponent.active = false; });
      opponents.filter(opponent => opponent.startActive).forEach(opponent => {
        activateOpponent(opponent, opponent.startLane, opponent.startX + randomBetween(-35, 35), pickTrafficSpeed(opponent.startProfile));
      });
    }

    function spawnOpponent() {
      const opponent = Array.from({ length: opponents.length }, (_, i) => opponents[(nextOpponentSlot + i) % opponents.length]).find(other => !other.active);
      const active = opponents.filter(other => other.active);
      if (!opponent || active.length >= MAX_ACTIVE_OPPONENTS) return;
      let velocity = pickTrafficSpeed();
      for (let retry = 0; retry < 6 && Math.abs(velocity - speed) < 14; retry++) velocity = pickTrafficSpeed();
      if (Math.abs(velocity - speed) < 14) velocity = pickTrafficSpeed(speed <= 100 ? 'fast' : 'slow');
      const x = velocity < speed ? randomBetween(1640, 1780) : randomBetween(-430, -300);
      const freeLanes = [0, 1, 2, 3].filter(candidate => {
        const occupying = active.filter(other => Math.abs(other.lane - candidate) < .6 || other.targetLane === candidate);
        if (occupying.length >= 2) return false;
        // Reserve a safe longitudinal gap at entry, including approaching riders
        // and both ends of any lane change. Two staggered rivals can share a lane.
        return occupying.every(other => Math.abs(other.x - x) > 620 + Math.abs(other.speed - velocity) * 2.35 * .9);
      });
      if (!freeLanes.length) return;
      const assignedLane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
      activateOpponent(opponent, assignedLane, x, velocity);
      nextOpponentSlot = (opponent.index + 1) % opponents.length;
    }

    function predictedOpponentLane(opponent, seconds, candidate) {
      const start = candidate === undefined ? opponent.laneStart : opponent.lane;
      const destination = candidate === undefined ? opponent.targetLane : candidate;
      const elapsed = candidate === undefined ? opponent.maneuverTime : 0;
      const u = clamp((elapsed + seconds) / EVADE_DURATION, 0, 1);
      return start + (destination - start) * u * u * (3 - 2 * u);
    }

    function opponentVelocity(opponent) {
      return (opponent.speed - speed) * (2.05 + opponent.lane * .1);
    }

    function predictedConflict(opponent, other, candidate) {
      const isPlayer = other === null;
      const otherX = isPlayer ? PLAYER_X : other.x;
      const relativeVelocity = opponentVelocity(opponent) - (isPlayer ? 0 : opponentVelocity(other));
      const destination = candidate === undefined ? opponent.targetLane : candidate;
      const otherDestination = isPlayer ? targetLane : other.targetLane;
      const otherLane = isPlayer ? lane : other.lane;
      // Reject separated lane ranges and longitudinal intervals before sampling.
      // These conservative bounds retain the original .1-second swept prediction.
      if (Math.min(opponent.lane, destination) > Math.max(otherLane, otherDestination) + .3 ||
          Math.min(otherLane, otherDestination) > Math.max(opponent.lane, destination) + .3) return Infinity;
      const maxWidth = 135 * 2.05 * laneScale(Math.max(opponent.lane, destination)) +
        (isPlayer ? 315 : 135 * 2.05) * laneScale(Math.max(otherLane, otherDestination)) + 60;
      const startGap = opponent.x - otherX;
      const endGap = startGap + relativeVelocity * AVOIDANCE_HORIZON;
      if (Math.min(startGap, endGap) > maxWidth || Math.max(startGap, endGap) < -maxWidth) return Infinity;
      const otherLaneAt = t => isPlayer ? lane + (targetLane - lane) * (1 - Math.exp(-6 * t)) : predictedOpponentLane(other, t);
      let previousA = predictedOpponentLane(opponent, 0, candidate);
      let previousB = otherLaneAt(0);
      // Sweep short prediction segments, including each vehicle's intended lane.
      for (let t = .1; t <= AVOIDANCE_HORIZON + .001; t += .1) {
        const nextA = predictedOpponentLane(opponent, t, candidate);
        const nextB = otherLaneAt(t);
        const aScale = laneScale(Math.max(previousA, nextA));
        const bScale = laneScale(Math.max(previousB, nextB));
        const halfWidth = 135 * 2.05 * aScale + (isPlayer ? 315 : 135 * 2.05) * bScale + 60;
        if (sweptOverlap(
          opponent.x - otherX + relativeVelocity * (t - .1), opponent.x - otherX + relativeVelocity * t,
          previousA - previousB, nextA - nextB, halfWidth, .3
        )) return t;
        previousA = nextA;
        previousB = nextB;
      }
      return Infinity;
    }

    function nearestThreat(opponent) {
      let threat = null;
      let earliest = Infinity;
      const others = [...opponents.filter(other => other.active && other !== opponent), ...(!crash ? [null] : [])];
      for (const other of others) {
        const time = predictedConflict(opponent, other);
        if (time < earliest) {
          earliest = time;
          threat = { x: other === null ? PLAYER_X : other.x, speed: other === null ? speed : other.speed };
        }
      }
      return threat;
    }

    function safeEvasionLane(opponent, candidate) {
      if (candidate < 0 || candidate > 3) return false;
      if (!crash && predictedConflict(opponent, null, candidate) !== Infinity) return false;
      return !opponents.some(other => other.active && other !== opponent && predictedConflict(opponent, other, candidate) !== Infinity);
    }

    function planAvoidance(opponent, dt) {
      opponent.avoidCooldown = Math.max(0, opponent.avoidCooldown - dt);
      const changingLane = opponent.maneuverTime < EVADE_DURATION;
      opponent.avoidance = changingLane ? 'evading' : 'cruising';
      const threat = nearestThreat(opponent);
      let desiredSpeed = opponent.cruiseSpeed;
      if (threat) {
        const candidates = changingLane || opponent.avoidCooldown > 0 ? [] : [opponent.targetLane - 1, opponent.targetLane + 1]
          .filter(candidate => safeEvasionLane(opponent, candidate))
          .sort((a, b) => Math.abs(b - targetLane) - Math.abs(a - targetLane));
        if (candidates.length) {
          opponent.laneStart = opponent.lane;
          opponent.targetLane = candidates[0];
          opponent.maneuverTime = 0;
          opponent.avoidCooldown = EVADE_DURATION + .65;
          opponent.avoidance = 'evading';
          opponent.evasions++;
          avoidanceCount++;
        } else {
          // Braking a front vehicle would worsen a rear-end threat; open the gap
          // by accelerating ahead, or brake when approaching from behind.
          const ahead = opponent.x >= threat.x;
          desiredSpeed = ahead ? Math.min(MAX_SPEED, Math.max(opponent.cruiseSpeed, threat.speed + 12))
            : Math.max(0, Math.min(opponent.cruiseSpeed, threat.speed - 18));
          if (!changingLane) opponent.avoidance = ahead ? 'accelerating' : 'braking';
        }
      }
      const rate = threat ? desiredSpeed > opponent.speed ? 55 : 95 : 14;
      opponent.braking = desiredSpeed < opponent.speed - .5;
      opponent.speed += clamp(desiredSpeed - opponent.speed, -rate * dt, rate * dt);
    }

    function moveOpponent(opponent, dt) {
      opponent.previousX = opponent.x;
      opponent.previousLane = opponent.lane;
      opponent.recycled = false;
      if (!opponent.active) return;
      opponent.age += dt;
      if (opponent.maneuverTime < EVADE_DURATION) {
        opponent.maneuverTime = Math.min(EVADE_DURATION, opponent.maneuverTime + dt);
        const u = opponent.maneuverTime / EVADE_DURATION;
        opponent.lane = predictedOpponentLane(opponent, 0);
        opponent.laneVelocity = (opponent.targetLane - opponent.laneStart) * 6 * u * (1 - u) / EVADE_DURATION;
      } else {
        opponent.lane = opponent.targetLane;
        opponent.laneVelocity = 0;
      }
      opponent.bank += (clamp(opponent.laneVelocity * 3.8, -11, 11) - opponent.bank) * (1 - Math.exp(-14 * dt));
      const relativeMotion = opponentVelocity(opponent) * dt;
      opponent.x += relativeMotion;
      const offscreen = opponent.x < -260 || opponent.x > 1660;
      opponent.offscreenAge = offscreen ? opponent.offscreenAge + dt : 0;
      if ((opponent.x < -420 && relativeMotion < 0) || (opponent.x > 1780 && relativeMotion > 0) || opponent.offscreenAge > 14) retireOpponent(opponent);
    }

    function beginCrash(opponent) {
      const scale = laneScale(lane);
      crash = {
        elapsed: 0, opponent,
        x: PLAYER_X + (opponent.x >= PLAYER_X ? 1 : -1) * 285 * scale,
        y: laneY(lane) - 105 * scale
      };
      collisionCount++;
      speed = 0;
      keys.clear();
      targetLane = Math.round(lane);
      laneVelocity = 0;
      explosion.setAttribute('transform', `translate(${crash.x} ${crash.y})`);
      attr(explosion, 'visibility', 'visible');
    }

    function finishCrash() {
      lane = targetLane = Math.round(lane);
      laneVelocity = 0;
      bank = 0;
      speed = 0;
      keys.clear();
      opponents.forEach(opponent => {
        if (opponent.active && (opponent === crash.opponent || (Math.abs(opponent.lane - lane) < .65 && Math.abs(opponent.x - PLAYER_X) < 560))) {
          retireOpponent(opponent);
        }
      });
      spawnTimer = Math.max(spawnTimer, 2.5);
      crash = null;
      invulnerability = 2.5;
    }

    function resetGame() {
      keys.clear();
      speed = 60;
      lean = distance = bank = laneVelocity = collisionCount = invulnerability = 0;
      lane = targetLane = 2;
      crash = null;
      sparkCursor = sparkBursts = continuousSparkEmissions = 0;
      sparkMode = 'off';
      clearTireSparks();
      lastPose = -1;
      resetTraffic();
      lastTime = performance.now();
      simulationAccumulator = 0;
      render(lastTime);
    }

    function renderExplosion() {
      if (!crash) {
        attr(explosion, 'visibility', 'hidden');
        attr(flash, 'opacity', '0');
        return;
      }
      const t = crash.elapsed;
      const shock = clamp(t / .7, 0, 1);
      halo.setAttribute('r', 110 + Math.min(t, .5) * 160);
      halo.setAttribute('opacity', Math.exp(-t * 6).toFixed(3));
      ring.setAttribute('r', 8 + shock * 240);
      ring.setAttribute('transform', 'scale(1 .8)');
      ring.setAttribute('stroke-width', 1 + (1 - shock) * 5);
      ring.setAttribute('opacity', ((1 - shock) ** 2 * .9).toFixed(3));
      attr(flash, 'opacity', (.18 * Math.max(0, 1 - t / .16)).toFixed(3));
      fireParticles.forEach(p => {
        const age = t - p.delay;
        const progress = clamp(age / p.life, 0, 1);
        const spread = (35 + progress * 125) * progress;
        p.node.setAttribute('cx', Math.cos(p.angle) * spread);
        p.node.setAttribute('cy', Math.sin(p.angle) * spread * .75 - progress * 45);
        p.node.setAttribute('r', p.radius * (.5 + Math.sin(progress * Math.PI)));
        p.node.setAttribute('opacity', age < 0 || progress >= 1 ? 0 : Math.sin(progress * Math.PI) ** .35);
      });
      smokeParticles.forEach(p => {
        const progress = clamp((t - p.delay) / 1.65, 0, 1);
        p.node.setAttribute('cx', p.offset * progress - progress * 50);
        p.node.setAttribute('cy', -20 - progress * 175);
        p.node.setAttribute('r', 10 + progress * 44);
        p.node.setAttribute('opacity', (.52 * Math.min(1, progress * 6) * (1 - progress)).toFixed(3));
      });
      sparks.forEach(p => {
        const progress = clamp(t / 1.05, 0, 1);
        const vx = Math.cos(p.angle) * p.velocity;
        const vy = Math.sin(p.angle) * p.velocity * .75 - 65;
        const x = vx * t;
        const y = vy * t + 95 * t * t;
        p.node.setAttribute('d', `M${x} ${y}l${-vx * .045} ${-vy * .045}`);
        p.node.setAttribute('stroke-width', .6 + (1 - progress) * 1.8);
        p.node.setAttribute('opacity', ((1 - progress) ** 1.5).toFixed(3));
      });
      debris.forEach(p => {
        p.node.setAttribute('transform', `translate(${p.vx * t} ${p.vy * t + 155 * t * t}) rotate(${p.spin * t})`);
        p.node.setAttribute('opacity', Math.max(0, 1 - t / 1.4).toFixed(3));
      });
    }

    function handleKey(event) {
      const code = event.code || ({ w: 'KeyW', s: 'KeyS', a: 'KeyA', d: 'KeyD', r: 'KeyR' }[event.key?.toLowerCase()]);
      if (!['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyR'].includes(code)) return;
      if (event.type === 'keydown' && (event.ctrlKey || event.metaKey || event.altKey)) return;
      event.preventDefault();
      if (event.type === 'keyup') {
        keys.delete(code);
        return;
      }
      const fresh = !keys.has(code) && !event.repeat;
      if (code === 'KeyR') {
        if (fresh) resetGame();
        return;
      }
      if (crash) return;
      keys.add(code);
      if (fresh && code === 'KeyA') targetLane = clamp(targetLane - 1, 0, 3);
      if (fresh && code === 'KeyD') targetLane = clamp(targetLane + 1, 0, 3);
    }
    window.addEventListener('keydown', handleKey);
    window.addEventListener('keyup', handleKey);
    window.addEventListener('blur', () => keys.clear());
    document.addEventListener('visibilitychange', () => {
      keys.clear();
      lastTime = performance.now();
      simulationAccumulator = 0;
      timingStart = lastTime + 500;
      timingFrames = 0;
    });
    root.addEventListener('pointerdown', event => {
      if (!event.target.closest('.weather-button')) root.focus({ preventScroll: true });
    });

    function clearTireSparks() {
      sparkTimer = .2;
      continuousSparkTimer = 0;
      tireSparkParticles.forEach(p => { p.age = p.life; attr(p.node, 'opacity', '0'); });
    }

    function updateTireSparks(dt) {
      const mode = crash || speed <= HIGH_SPEED ? 'off' : speed > CONTINUOUS_SPARK_SPEED ? 'continuous' : 'intermittent';
      if (mode !== sparkMode) {
        clearTireSparks();
        sparkMode = mode;
      }
      if (mode === 'off') return;
      const intensity = .5 + .5 * clamp((speed - HIGH_SPEED) / (MAX_SPEED - HIGH_SPEED), 0, 1);
      if (mode === 'continuous') {
        const stress = clamp((speed - CONTINUOUS_SPARK_SPEED) / (MAX_SPEED - CONTINUOUS_SPARK_SPEED), 0, 1);
        continuousSparkTimer -= dt;
        // Four rotating emitters: the rim and tire edge of each wheel. Time-based
        // emission keeps the stream continuous at different frame rates.
        while (continuousSparkTimer <= 0) {
          const age = -continuousSparkTimer;
          const phase = (distance - speed * 16.44 * age) / 113;
          for (const [wheelIndex, wheelX] of [470, 989].entries()) {
            for (const [kind, radius, offset] of [['rim', 88, -Math.PI / 2], ['tire', 111, Math.PI / 2]]) {
              const p = tireSparkParticles[sparkCursor++ % tireSparkParticles.length];
              const angle = phase + offset;
              p.kind = 'continuous';
              p.source = `${wheelIndex ? 'front' : 'rear'}-${kind}`;
              p.angle = angle;
              p.age = age - dt;
              p.life = randomBetween(.22, .44);
              p.x = wheelX + Math.cos(angle) * radius;
              p.y = 665 + Math.sin(angle) * radius;
              p.vx = -randomBetween(260, 430) - stress * 100 - Math.sin(angle) * (160 + stress * 80);
              p.vy = Math.cos(angle) * (130 + stress * 80) - randomBetween(25, 95);
              continuousSparkEmissions++;
            }
          }
          continuousSparkTimer += MOBILE_LITE ? .042 - stress * .01 : .021 - stress * .005;
        }
      } else {
        sparkTimer -= dt;
        if (sparkTimer <= 0) {
          const wheelX = sparkBursts % 3 === 2 ? 989 : 470;
          sparkBursts++;
          const count = 6 + Math.floor(Math.random() * 5);
          for (let i = 0; i < count; i++) {
            const p = tireSparkParticles[sparkCursor++ % tireSparkParticles.length];
            p.kind = 'burst';
            p.source = wheelX === 470 ? 'rear-tire' : 'front-tire';
            p.age = 0;
            p.life = randomBetween(.24, .5);
            p.x = wheelX + randomBetween(-5, 3);
            p.y = 776;
            p.vx = -randomBetween(180, 360) - intensity * 180;
            p.vy = -randomBetween(65, 190);
          }
          sparkTimer = randomBetween(.65, 1.45) / (.85 + intensity * .35);
        }
      }
      tireSparkParticles.forEach(p => { if (p.age < p.life) p.age += dt; });
    }

    function renderTireSparks() {
      if (sparkMode === 'off') return;
      tireSparkParticles.forEach(p => {
        if (p.age >= p.life) {
          attr(p.node, 'opacity', '0');
          return;
        }
        const progress = p.age / p.life;
        const x = p.x + p.vx * p.age;
        const y = p.y + p.vy * p.age + 230 * p.age * p.age;
        const vy = p.vy + 460 * p.age;
        const tail = p.kind === 'continuous' ? .034 : .025;
        attr(p.node, 'd', `M${x.toFixed(1)} ${y.toFixed(1)}l${(-p.vx * tail).toFixed(1)} ${(-vy * tail).toFixed(1)}`);
        attr(p.node, 'stroke-width', (1 + 1.6 * (1 - progress)).toFixed(1));
        attr(p.node, 'opacity', ((1 - progress) ** .65).toFixed(2));
      });
    }

    function renderPose() {
      if (Math.abs(lean - lastPose) < .0001) return;
      lastPose = lean;
      // Keep the hip on the seat and the grip at (850, 480).
      torso.setAttribute('transform', `matrix(1 0 ${-.16 * lean} ${1 - .22 * lean} ${78.4 * lean} ${107.8 * lean})`);
      head.setAttribute('transform', `translate(${32 * lean} ${72 * lean})`);
      bill.setAttribute('transform', `translate(${32 * lean} ${72 * lean})`);
      wing.setAttribute('transform', `matrix(1 0 ${-.2 * lean} ${1 - .36 * lean} ${96 * lean} ${172.8 * lean})`);
      for (const morph of morphs) {
        let index = 0;
        morph.node.setAttribute('d', morph.template.replace(numberPattern, () => {
          const i = index++;
          return (morph.rest[i] + (morph.tucked[i] - morph.rest[i]) * lean).toFixed(3);
        }));
      }
    }

    function render(now) {
      const tucked = speed > TUCK_SPEED;
      const highSpeed = !crash && speed > HIGH_SPEED;
      const intensity = highSpeed ? .5 + .5 * clamp((speed - HIGH_SPEED) / (MAX_SPEED - HIGH_SPEED), 0, 1) : 0;
      if (weatherVisualDirty && (now - lastWeatherPaint >= 66 || !weatherTransition)) {
        applyWeather();
        lastWeatherPaint = now;
        weatherVisualDirty = false;
      }
      const publish = now - lastStatePublish >= 100;
      attr(laneHighlight, 'y', (laneY(lane) - 30).toFixed(2));
      attr(laneHighlight, 'fill', crash ? '#ed9b67' : '#fff');
      const scale = laneScale(lane);
      const shake = crash ? Math.sin(crash.elapsed * 85) * 7 * Math.exp(-crash.elapsed * 5) : 0;
      attr(player, 'transform', `translate(${(PLAYER_X + shake).toFixed(2)} ${laneY(lane).toFixed(2)}) scale(${scale.toFixed(4)}) translate(-730 -778)`);
      attr(player, 'opacity', (crash ? Math.max(.1, 1 - crash.elapsed * 5) : invulnerability > 0 ? .75 + Math.sin(now / 170) * .25 : 1).toFixed(3));
      attr(wheel, 'transform', `rotate(${(distance / 113 * 180 / Math.PI % 360).toFixed(2)})`);
      const impactBank = crash ? 12 * Math.min(1, crash.elapsed * 5) : 0;
      const bob = -Math.sin(distance / 250 * Math.PI * 2) * .8 * Math.min(1, speed / 30);
      attr(racer, 'transform', `translate(0 ${bob.toFixed(2)}) rotate(${(bank + impactBank).toFixed(2)} 730 778)`);
      attr(spray, 'transform', `rotate(${bank.toFixed(2)} 730 778)`);
      [...cityLayers, ...roadLayers].forEach(layer => attr(layer.node, 'transform', `translate(${(-(distance * layer.factor % layer.period)).toFixed(2)} 0)`));
      attr(wind, 'transform', `translate(${(30 - 80 * (distance / 641 % 1)).toFixed(2)} 0)`);
      attr(trails, 'opacity', Math.min(1, speed / 95).toFixed(3));
      const exhaustScale = highSpeed ? 1.55 + (intensity - .5) * 2.6 : .35 + .3 * Math.min(1, speed / HIGH_SPEED);
      attr(plume, 'transform', `translate(369 620) scale(${exhaustScale.toFixed(3)} 1)`);
      attr(plume, 'opacity', (Math.min(1, speed / 50) * (highSpeed ? .96 : .55)).toFixed(3));
      attr(airflow, 'visibility', highSpeed ? 'visible' : 'hidden');
      attr(airflow, 'opacity', highSpeed ? (.65 + .35 * intensity).toFixed(3) : '0');
      if (highSpeed) {
        attr(airflow, 'transform', `rotate(${bank.toFixed(2)} 730 778)`);
        attr(airflowStreaks, 'stroke-dashoffset', (-(distance * 1.9 % 440)).toFixed(2));
        attr(tireSparks, 'transform', `translate(0 ${bob.toFixed(2)}) rotate(${bank.toFixed(2)} 730 778)`);
      }
      attr(tireSparks, 'visibility', highSpeed ? 'visible' : 'hidden');
      attr(tireSparks, 'opacity', highSpeed ? '1' : '0');
      attr(sparkGlints, 'visibility', sparkMode === 'continuous' ? 'visible' : 'hidden');
      if (sparkMode === 'continuous') rotatingSparkGlints.forEach(node => attr(node, 'transform', wheel.getAttribute('transform')));
      renderPose();
      renderTireSparks();

      renderWeather();
      opponents.forEach(opponent => {
        if (publish) {
          const details = { active: String(opponent.active), lane: opponent.lane.toFixed(4), targetLane: String(opponent.targetLane),
            speed: opponent.speed.toFixed(3), avoidance: opponent.avoidance, evasions: String(opponent.evasions),
            bank: opponent.bank.toFixed(3), braking: String(opponent.braking), x: opponent.x.toFixed(2) };
          Object.entries(details).forEach(([key, value]) => attr(opponent.node, 'data-' + key.replace(/[A-Z]/g, c => '-' + c.toLowerCase()), value));
        }
        const visible = opponent.active && opponent.x >= -260 && opponent.x <= 1660;
        attr(opponent.node, 'visibility', visible ? 'visible' : 'hidden');
        if (!visible) return;
        const s = laneScale(opponent.lane) * 2.05;
        const bob = Math.sin(now / 170 + opponent.index * 2) * .45;
        attr(opponent.node, 'transform', `translate(${opponent.x.toFixed(2)} ${(laneY(opponent.lane) + bob).toFixed(2)}) scale(${s.toFixed(4)}) rotate(${opponent.bank.toFixed(2)}) translate(-98 -43)`);
        style(opponent.node, '--wheel-duration', `${(88 / Math.max(.01, opponent.speed)).toFixed(3)}s`);
        style(opponent.node, '--brake-light', opponent.braking ? '1' : '.65');
        style(opponent.node, '--emergency-brake', opponent.braking ? '.9' : '0');
        const turnFlash = opponent.maneuverTime < EVADE_DURATION && Math.floor(now / 110) % 2 ? '1' : '0';
        style(opponent.node, '--turn-left', opponent.targetLane < opponent.laneStart ? turnFlash : '0');
        style(opponent.node, '--turn-right', opponent.targetLane > opponent.laneStart ? turnFlash : '0');
        const visibility = clamp((opponent.x + 240) / 180, 0, 1) * clamp((1660 - opponent.x) / 180, 0, 1);
        const hitOpacity = crash?.opponent === opponent ? Math.max(.05, 1 - crash.elapsed * 5) : 1;
        attr(opponent.node, 'opacity', ((.72 + opponent.lane * .07) * visibility * hitOpacity).toFixed(3));
      });
      const sorted = [...opponents.filter(opponent => opponent.active).map(opponent => ({ node: opponent.node, depth: opponent.lane })), { node: player, depth: lane }]
        .sort((a, b) => a.depth - b.depth);
      const order = sorted.map(item => item.node.id).join(',');
      if (order !== depthOrder) {
        sorted.forEach(item => traffic.appendChild(item.node));
        depthOrder = order;
      }
      renderExplosion();
      Object.assign(raceState, {
        speed: speed.toFixed(3), posture: tucked ? 'tucked' : 'upright', lean: lean.toFixed(4),
        lane: lane.toFixed(4), targetLane: String(targetLane), bank: bank.toFixed(3), playerScale: scale.toFixed(4),
        gameState: crash ? 'crashed' : 'racing', collisionCount: String(collisionCount),
        explosionTime: crash ? crash.elapsed.toFixed(3) : '-1', invulnerability: invulnerability.toFixed(3),
        activeOpponents: String(opponents.filter(opponent => opponent.active).length), spawnCount: String(spawnCount), nextSpawn: spawnTimer.toFixed(3),
        highSpeed: String(highSpeed), exhaustScale: exhaustScale.toFixed(3),
        tireSparks: String(highSpeed ? tireSparkParticles.filter(p => p.age < p.life).length : 0),
        sparkBursts: String(sparkBursts), sparkMode,
        continuousSparks: String(tireSparkParticles.filter(p => p.kind === 'continuous' && p.age < p.life).length),
        continuousSparkEmissions: String(continuousSparkEmissions), avoidanceCount: String(avoidanceCount),
        evadingOpponents: String(opponents.filter(opponent => opponent.active && opponent.maneuverTime < EVADE_DURATION).length),
        renderTarget: String(Math.round(1000 / paintInterval))
      });
      if (publish) publishState(now);
    }

    function publishState(now, force = false) {
      if (!force && now - lastStatePublish < 100) return;
      lastStatePublish = now;
      Object.entries(raceState).forEach(([key, value]) => attr(root, 'data-' + key.replace(/[A-Z]/g, c => '-' + c.toLowerCase()), value));
      stateListener?.(raceState);
    }

    function simulate(dt) {
      const previousLane = lane;
      invulnerability = Math.max(0, invulnerability - dt);
      if (crash) {
        crash.elapsed += dt;
        speed = 0;
      } else {
        const acceleration = keys.has('KeyS') ? -BRAKING : keys.has('KeyW') ? ACCELERATION : 0;
        speed = clamp(speed + acceleration * dt, 0, MAX_SPEED);
        laneVelocity += ((targetLane - lane) * 45 - laneVelocity * 13) * dt;
        lane = clamp(lane + laneVelocity * dt, 0, 3);
        if (Math.abs(lane - targetLane) < .0005 && Math.abs(laneVelocity) < .005) {
          lane = targetLane;
          laneVelocity = 0;
        }
      }
      const targetBank = crash ? 0 : clamp(laneVelocity * 4.5, -10, 10);
      bank += (targetBank - bank) * (1 - Math.exp(-9 * dt));
      const targetLean = speed > TUCK_SPEED ? 1 : 0;
      lean += (targetLean - lean) * (1 - Math.exp(-7 * dt));
      if (Math.abs(targetLean - lean) < .0001) lean = targetLean;
      distance += speed * 16.44 * dt;
      weatherClock += dt;
      updateWeatherTransition(dt);
      windTravel += dt * (120 + 320 * weather.wind);
      groundDriftTravel += dt * (180 - 85 * weather.flakes);
      rain.forEach(layer => { layer.phase = (layer.phase + dt * weather.fall / layer.duration) % 1; });
      snow.forEach(layer => { layer.phase = (layer.phase + dt / layer.duration) % 1; });
      // Plan in a stable order so later riders see lanes already reserved by
      // earlier decisions. Advance everyone only after the planning pass.
      opponents.filter(opponent => opponent.active).forEach(opponent => planAvoidance(opponent, dt));
      opponents.forEach(opponent => moveOpponent(opponent, dt));
      if (!crash) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnOpponent();
          spawnTimer = randomBetween(1.7, 3);
        }
      }
      if (!crash && invulnerability === 0) {
        const hit = opponents.find(opponent => opponent.active && !opponent.recycled && sweptOverlap(
          opponent.previousX - PLAYER_X, opponent.x - PLAYER_X,
          previousLane - opponent.previousLane, lane - opponent.lane,
          315 * laneScale(Math.max(previousLane, lane)) + 135 * laneScale(Math.max(opponent.previousLane, opponent.lane)) * 2.05, .24
        ));
        if (hit) beginCrash(hit);
      }
      if (crash && crash.elapsed >= 1.9) finishCrash();
      updateTireSparks(dt);
    }

    function frame(now) {
      const elapsed = clamp((now - lastTime) / 1000, 0, MAX_CATCHUP);
      lastTime = now;
      if (document.hidden) {
        simulationAccumulator = 0;
        requestAnimationFrame(frame);
        return;
      }
      simulationAccumulator += elapsed;
      // Physics and collision sweeps keep their 60 Hz step even when rendering
      // falls back to 30 Hz. A brief slow frame cannot halve the driving speed.
      while (simulationAccumulator + 1e-9 >= SIMULATION_STEP) {
        simulate(SIMULATION_STEP);
        simulationAccumulator -= SIMULATION_STEP;
      }
      if (now >= timingStart) timingFrames++;
      if (now - timingStart >= 2000) {
        if ((now - timingStart) / timingFrames > 23) paintInterval = 1000 / 30;
        timingStart = now;
        timingFrames = 0;
      }
      if (now - lastPaint >= paintInterval - .5) {
        lastPaint = Number.isFinite(lastPaint) ? lastPaint + Math.max(1, Math.floor((now - lastPaint + .5) / paintInterval)) * paintInterval : now;
        render(now);
      }
      requestAnimationFrame(frame);
    }
    window.pelicanGame = Object.freeze({
      press(code) { handleKey({ code, type: 'keydown', preventDefault() {} }); },
      release(code) { handleKey({ code, type: 'keyup', preventDefault() {} }); },
      releaseAll() { keys.clear(); },
      restart() { resetGame(); publishState(performance.now(), true); },
      setWeather(key) { setWeather(key); publishState(performance.now(), true); },
      state() { return { ...raceState }; },
      subscribe(listener) {
        stateListener = listener;
        return () => { if (stateListener === listener) stateListener = null; };
      }
    });
    setWeather('thunder', false);
    layoutWeatherPanel();
    resetTraffic();
    render(lastTime);
    raceState.controller = 'ready';
    publishState(lastTime, true);
    requestAnimationFrame(frame);
  })();
  ]]></script>
</svg>

    <div class="touch-row">
      <div class="steer"><button id="mobile-up" class="drive-button" type="button" data-drive="KeyA" aria-label="向上换一条车道"><span class="glyph">↑</span><span class="label">上移</span></button><button id="mobile-down" class="drive-button" type="button" data-drive="KeyD" aria-label="向下换一条车道"><span class="glyph">↓</span><span class="label">下移</span></button></div>
      <div class="pedals"><button id="mobile-brake" class="drive-button" type="button" data-drive="KeyS" aria-label="按住刹车"><span class="glyph">−</span><span class="label">刹车</span></button><button id="mobile-throttle" class="drive-button" type="button" data-drive="KeyW" aria-label="按住加速"><span class="glyph">＋</span><span class="label">油门</span></button></div>
    </div>
    <p class="mobile-tip">双指可同时操作 · 横屏视野更宽</p>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const game = window.pelicanGame;
  const scene = document.getElementById('race-scene');
  const app = document.getElementById('mobile-app');
  const get = id => document.getElementById(id);
  const driveButtons = Array.from(document.querySelectorAll('[data-drive]'));
  const choices = Array.from(document.querySelectorAll('[data-select-weather]'));
  const pointers = new Map();
  const keyboardButtons = new Set();
  const labels = {typhoon:'台风',blizzard:'暴雪',night:'雨夜',sunny:'晴天',thunder:'雷暴雨',smog:'雾霾'};
  const details = {typhoon:'强风渐起 · 横向雨幕 · 低空水雾',blizzard:'雨雪交替 · 积雪渐覆 · 暖色辅灯',night:'小雨少云 · 月牙稀星 · 乌鹊南飞',sunny:'日照 · 护栏斜影 · 干燥路面',thunder:'倾盆大雨 · 三处密集闪电 · 积水反光',smog:'漂移雾带 · 低位雾灯 · 暖色散射'};
  const paintButtons = () => driveButtons.forEach(button => {
    const active = Array.from(pointers.values()).some(code => code === button.dataset.drive) || keyboardButtons.has(button.dataset.drive);
    button.classList.toggle('pressed', active);
    button.setAttribute('aria-pressed', String(active));
  });
  const releasePointer = event => {
    const code = pointers.get(event.pointerId);
    if (!code) return;
    pointers.delete(event.pointerId);
    if (!Array.from(pointers.values()).includes(code)) game.release(code);
    paintButtons();
  };
  function releaseAll() {
    pointers.clear();keyboardButtons.clear();game.releaseAll();paintButtons();
  }
  driveButtons.forEach(button => {
    button.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      const code = button.dataset.drive;
      const alreadyHeld = Array.from(pointers.values()).includes(code);
      pointers.set(event.pointerId, code);
      if (!alreadyHeld) game.press(code);
      paintButtons();
    });
    for (const event of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(event, releasePointer);
    // Keyboard and screen-reader activation of the touch controls.
    button.addEventListener('click', event => {if(event.detail===0){game.press(button.dataset.drive);game.release(button.dataset.drive);}});
  });
  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => {if(document.hidden)releaseAll();});
  window.addEventListener('keydown', event => {if(driveButtons.some(b=>b.dataset.drive===event.code)){keyboardButtons.add(event.code);paintButtons();}if(event.code==='Escape')toggleWeather(false);});
  window.addEventListener('keyup', event => {keyboardButtons.delete(event.code);paintButtons();});
  window.addEventListener('contextmenu', event => event.preventDefault());
  function toggleWeather(open) {
    get('mobile-weather-drawer').hidden = !open;
    get('mobile-weather-toggle').setAttribute('aria-expanded', String(open));
  }
  function activate(button, action) {
    let touchActivation = false;
    button.addEventListener('pointerdown', event => { touchActivation = event.pointerType !== 'mouse'; });
    button.addEventListener('pointerup', event => {
      if (event.pointerType === 'mouse') return;
      event.preventDefault();
      const box = button.getBoundingClientRect();
      if (event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom) action();
    });
    button.addEventListener('click', event => { if (event.detail === 0 || !touchActivation) action(); });
  }
  activate(get('mobile-weather-toggle'),()=>toggleWeather(get('mobile-weather-drawer').hidden));
  activate(get('mobile-weather-close'),()=>{toggleWeather(false);get('mobile-weather-toggle').focus({preventScroll:true});});
  choices.forEach(button=>activate(button,()=>{game.setWeather(button.dataset.selectWeather);toggleWeather(false);}));
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('#mobile-weather-drawer,#mobile-weather-toggle'))toggleWeather(false);});
  activate(get('mobile-restart'),()=>{releaseAll();game.restart();});
  if (!document.documentElement.requestFullscreen) get('mobile-fullscreen').hidden = true;
  activate(get('mobile-fullscreen'),async()=>{
    try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch{}
  });
  document.addEventListener('fullscreenchange',()=>get('mobile-fullscreen').setAttribute('aria-label',document.fullscreenElement?'退出全屏':'进入全屏'));
  let orientation = '';
  function fitScene() {
    const next = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
    if (orientation && orientation !== next) releaseAll();
    orientation = next;
    scene.setAttribute('viewBox', next==='landscape'?'0 100 1400 790':'190 0 1020 900');
    scene.setAttribute('preserveAspectRatio',next==='landscape'?'xMidYMid meet':'xMidYMid slice');
    app.dataset.orientation = next;
  }
  window.addEventListener('resize',fitScene);
  window.visualViewport?.addEventListener('resize',fitScene);
  fitScene();
  let previousSpeed=-1,previousWeather='',previousLane=-1,previousStatus='';
  function updateHud(state) {
    const speed = Math.round(Number(state.speed));
    if(speed!==previousSpeed){get('mobile-speed').textContent=String(speed);previousSpeed=speed;}
    app.classList.toggle('fast',Number(state.speed)>160);
    const lane=Number(state.targetLane);
    if(lane!==previousLane){Array.from(get('mobile-lanes').children).forEach((node,i)=>node.classList.toggle('selected',i===lane));get('mobile-lanes').setAttribute('aria-label',`第${lane+1}车道`);get('mobile-up').classList.toggle('at-edge',lane===0);get('mobile-down').classList.toggle('at-edge',lane===3);previousLane=lane;}
    if(state.weather!==previousWeather){get('mobile-weather-name').textContent=labels[state.weather];get('mobile-weather-detail').textContent=details[state.weather];choices.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.selectWeather===state.weather)));previousWeather=state.weather;}
    const transitioning=state.weatherTransition==='true';
    const progress=Math.round(Number(state.weatherProgress)*100);
    const track=get('mobile-transition-track');track.style.width=transitioning?`${progress}%`:'0';track.style.opacity=transitioning?'1':'0';track.setAttribute('aria-valuenow',String(progress));
    const status=state.gameState==='crashed'?'碰撞 · 正在恢复':Number(state.invulnerability)>0?'恢复中 · 短暂无敌':transitioning?`${labels[state.weather]} · 天气渐变中`:'松开油门保持车速';
    if(status!==previousStatus){if(state.gameState==='crashed')releaseAll();get('mobile-state').textContent=status;previousStatus=status;}
  }
  game.subscribe(updateHud);
  updateHud(game.state());
})();
</script>
</body>
</html>
